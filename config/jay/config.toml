keymap.rmlvo = { layout = "us", variants = "" }

on-graphics-initialized = [
  { type = "exec", exec = "/usr/lib/pam_kwallet_init" },
  # { type = "exec", exec = "mako" },
  # { type = "exec", exec = "wl-tray-bridge" },
  { type = "exec", exec = "wayland-pipewire-idle-inhibit" },
  { type = "exec", exec = ["xrandr", "--output", "DP-3", "--primary"] },
  { type = "exec", exec = ["vicinae", "server"] },
  { type = "exec", exec = ["solaar", "-w", "hide"] },
  { type = "exec", exec = ["discord"] },
  { type = "exec", exec = ["signal-desktop", "--password-store=kwallet6"] },
  { type = "exec", exec = ["steam"] },
  { type = "exec", exec = ["firefox"] },
  { type = "exec", exec = ["noctalia", "--daemon"] },
]

show-bar = false
show-titles = false

auto-reload = true

idle = { minutes = 10, grace-period = { seconds = 3 } }
on-idle = { type = "exec", exec = { shell = "noctalia msg session lock" } }

window-management-key = "Super_L"

direct-scanout = true

render-device.name = "dedicated"

[env]
XDG_CURRENT_DESKTOP = "jay"
xDG_SESSION_TYPE = "wayland"
XDG_SESSION_DESKTOP = "jay"
XDG_MENU_PREFIX = "arch-"

PROTON_DXVK_LOWLATENCY = "1"

DXVK_FRAME_PACE = "low-latency-vrr-340"
DXVK_FRAME_RATE = "340"

VKD3D_FRAME_RATE = "340"
PROTON_VKD3D_LOWLATENCY = "1"
VKD3D_CONFIG = "descriptor_heap"
VKD3D_SWAPCHAIN_PRESENT_MODE = "FIFO"

ENABLE_LAYER_MESA_ANTI_LAG = "1"
RADV_EXPERIMENTAL = "heap"

[theme]
container-borders = "full"
border-width = 1

[[drm-devices]]
name = "dedicated"
match = { pci-vendor = 0x1002, pci-model = 0x7550 }
plane-color-pipelines = true

[[inputs]]
match.is-pointer = true
accel-profile = "Flat"
accel-speed = 0.0

[[outputs]]
name = "right"
match.connector = "DP-3"
x = 1920
y = 0
mode = { width = 2560, height = 1440, refresh-rate = 359.979 }
vrr = { mode = "variant1", cursor-hz = 90 }
tearing.mode = "variant1"

[[outputs]]
name = "left"
match.connector = "HDMI-A-1"
x = 0
y = 0
mode = { width = 1920, height = 1080, refresh-rate = 100.0 }

[[windows]]
match.x-class = "discord"
match.just-mapped = true
action = { type = "move-to-workspace", name = "5" }

[[windows]]
match.app-id = "signal"
match.just-mapped = true
action = { type = "move-to-workspace", name = "5" }

[[windows]]
match.x-class = "steam"
match.just-mapped = true
action = { type = "move-to-workspace", name = "3" }

[[windows]]
match.app-id = "solaar"
match.just-mapped = true
action = { type = "move-to-workspace", name = "2" }

# [[windows]]
# match.app-id = "firefox"
# match.just-mapped = true
# action = { type = "move-to-workspace", name = "4" }

[color-management]
enabled = true

