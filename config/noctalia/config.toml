[bar]
# order = ["secondary", "main"]

[bar.secondary]
position = "bottom"
enabled = true
auto_hide = false
reserve_space = true
layer = "top"
[bar.secondary.monitor.DP-1]
enabled = false

[bar.main]
position = "bottom"
enabled = false
auto_hide = true
reserve_space = false
# smart_auto_hide = true
show_on_workspace_switch = false
[bar.main.monitor.DP-1]
enabled = true
reserve_space = false

[lockscreen_widgets]
enabled = true

[lockscreen_widgets.widget.clock_main]
type = "clock"
output = "DP-1"
cx = 1600.0
cy = 120.0
box_width = 360.0
box_height = 120.0
rotation = 0.0

[lockscreen_widgets.widget.clock_main.settings]
format = "{:%H:%M}"

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.screen-off]
action = "command"
command = "jay randr output DP-1 disable; jay randr output HDMI-A-1 disable"
enabled = true
resume_command = "jay randr output DP-1 enable; jay randr output HDMI-A-1 enable"
timeout = 300.0

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600.0

[idle.behavior.lock-and-suspend]
action = "suspend"
enabled = true
lock_before_suspend = false
timeout = 900.0

[widget.clock]
format = "{:%I:%M %p %a %e %b}"
